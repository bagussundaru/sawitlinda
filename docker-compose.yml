services:
  db:
    image: postgres:16-alpine
    container_name: sawitscan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sawitscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sawitscan}
      POSTGRES_DB: ${POSTGRES_DB:-sawitscan}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sawitscan}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
