# Produksi. Dirancang agar aman berdampingan dengan aplikasi lain di VM yang sama:
#
#   - Nama proyek, container, jaringan, dan volume semuanya berawalan `sawitscan`,
#     sehingga tidak pernah bentrok dengan stack lain.
#   - PostgreSQL TIDAK mem-publish port ke host. Ia hanya dijangkau dari jaringan
#     internal compose, jadi instance PostgreSQL lain di VM tidak terganggu.
#   - Backend & frontend hanya mendengarkan di 127.0.0.1, bukan 0.0.0.0. Yang
#     menghadap internet cukup reverse proxy yang sudah ada di VM.
#   - Port host dapat diubah lewat .env bila 8000/3000 sudah terpakai.
#
# Jalankan:  docker compose -p sawitscan -f docker-compose.prod.yml up -d --build

name: sawitscan

services:
  db:
    image: postgres:16-alpine
    container_name: sawitscan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - sawitscan_pgdata:/var/lib/postgresql/data
    networks:
      - sawitscan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sawitscan-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      STORAGE_DIR: storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      - sawitscan_storage:/app/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - sawitscan

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # Prefiks path bila aplikasi dilayani di balik reverse proxy bersama,
        # mis. "/sawit". Kosongkan bila dilayani di root.
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    container_name: sawitscan-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - sawitscan

volumes:
  sawitscan_pgdata:
  sawitscan_storage:

networks:
  sawitscan:
    name: sawitscan
