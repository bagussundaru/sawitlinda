# Blok server nginx untuk SawitScan.
#
# Ini DITAMBAHKAN sebagai site baru, bukan mengganti konfigurasi yang sudah ada:
#
#   sudo cp deploy/nginx-sawitscan.conf /etc/nginx/sites-available/sawitscan
#   sudo ln -s /etc/nginx/sites-available/sawitscan /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# `nginx -t` menguji SELURUH konfigurasi termasuk site aplikasi lain, dan
# `reload` tidak memutus koneksi yang sedang berjalan.
#
# Ganti sawit.contoh.id dengan domain Anda. Untuk HTTPS, jalankan setelahnya:
#   sudo certbot --nginx -d sawit.contoh.id

server {
    listen 80;
    listen [::]:80;
    server_name sawit.contoh.id;

    # Citra UAV berukuran besar; samakan dengan MAX_UPLOAD_MB di .env.
    client_max_body_size 50M;

    access_log /var/log/nginx/sawitscan.access.log;
    error_log  /var/log/nginx/sawitscan.error.log;

    # API dan berkas citra ditangani backend.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inference sinkron: satu citra besar bisa memakan waktu.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # Sisanya ke frontend Next.js.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
